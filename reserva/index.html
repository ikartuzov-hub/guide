ação", "reviews": "avaliações", "foot": "Horários e avaliações verificados a 5 de setembro de 2026"}, "es": {"title": "Cena en Funchal", "sub": "Doce mesas que merecen reserva. Valoración, distancia, teléfono — nada más.", "near": "Más cercanos", "top": "Mejor valorados", "openonly": "Solo abiertos ahora", "google": "Google", "onmap": "En el mapa", "route": "Ruta", "call": "Llamar", "book": "Reservar", "opennow": "Abierto", "closed": "Cerrado", "locate": "Ver distancia", "denied": "Sin ubicación — ordenado por valoración", "reviews": "reseñas", "foot": "Horarios y valoraciones verificados el 5 de septiembre de 2026"}, "de": {"title": "Abendessen in Funchal", "sub": "Zwölf Tische, die eine Reservierung wert sind. Bewertung, Entfernung, Anruf — mehr nicht.", "near": "Nächste zuerst", "top": "Beste Bewertung", "openonly": "Nur jetzt geöffnet", "google": "Google", "onmap": "Auf der Karte", "route": "Route", "call": "Anrufen", "book": "Reservieren", "opennow": "Geöffnet", "closed": "Geschlossen", "locate": "Entfernung zeigen", "denied": "Ohne Standort — nach Bewertung sortiert", "reviews": "Bewertungen", "foot": "Öffnungszeiten und Bewertungen geprüft am 5. September 2026"}}, LANGS=["ru","en","pt","es","de"];
let L=(navigator.language||"ru").slice(0,2); if(!LANGS.includes(L))L="en";
let sort="top", openOnly=false, me=null;

function ls(k,v){try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}}
const qs=new URLSearchParams(location.search);
if(qs.get("lang")&&LANGS.includes(qs.get("lang")))L=qs.get("lang");
else if(ls("res_lang")&&LANGS.includes(ls("res_lang")))L=ls("res_lang");
let theme=qs.get("theme")||ls("res_theme")||"dark";
function applyTheme(){document.documentElement.setAttribute("data-theme",theme==="light"?"light":"dark");
 document.getElementById("themeBtn").textContent=theme==="light"?"☀":"☾";}

function openNow(p){const d=new Date(),w=(d.getDay()+6)%7,m=d.getHours()*60+d.getMinutes();
 const iv=p.open[String(w)]; if(!iv)return false;
 return iv.some(([a,b])=>m>=a&&m<b);}
function dist(a,b,c,e){const R=6371,t=x=>x*Math.PI/180;
 const dLa=t(c-a),dLo=t(e-b);
 const h=Math.sin(dLa/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLo/2)**2;
 return 2*R*Math.asin(Math.sqrt(h));}
function fmtD(km){const walk=Math.round(km/4.6*60);
 const d=km<1?Math.round(km*1000)+" m":km.toFixed(1)+" km";
 return walk<=25?d+" · "+walk+"′":d;}

function render(){
 const t=UI[L];
 document.documentElement.lang=L;
 document.getElementById("h1").textContent=t.title;
 document.getElementById("sub").textContent=t.sub;
 document.getElementById("bNear").textContent=t.near;
 document.getElementById("bTop").textContent=t.top;
 document.getElementById("bOpen").textContent=t.openonly;
 document.getElementById("foot").textContent=t.foot;
 langBtn.textContent=L.toUpperCase();
 fillLangMenu();
 document.getElementById("guideLink").href="../?guide=funchal-noite-igor&lang="+L;
 document.getElementById("bNear").setAttribute("aria-pressed",sort==="near");
 document.getElementById("bTop").setAttribute("aria-pressed",sort==="top");
 document.getElementById("bOpen").setAttribute("aria-pressed",openOnly);
 document.getElementById("hint").textContent = me ? "" : t.denied;

 let arr=P.slice();
 if(openOnly)arr=arr.filter(openNow);
 if(sort==="near"&&me)arr.sort((a,b)=>a._d-b._d); else arr.sort((a,b)=>b.r-a.r);

 document.getElementById("list").innerHTML=arr.map(p=>{
  const on=openNow(p);
  const dst=me?'<span class="dot">'+fmtD(p._d)+'</span>':'';
  const dir="https://www.google.com/maps/dir/?api=1&destination="+p.lat+","+p.lon+"&destination_place_id="+p.pid+(me?"&origin="+me.lat+","+me.lon:"");
  const book=p.site?'<a class="btn sec" href="'+p.site+'" target="_blank" rel="noopener">'+t.book+'</a>':'';
  const call=p.tel?'<a class="btn sec" href="tel:'+p.tel+'">'+t.call+'</a>':'';
  return '<article class="card">'
   +'<div class="row1"><span class="nm">'+p.name+'</span>'
   +'<span class="rt">★ '+p.r.toFixed(1).replace(".",L==="en"?".":",")+'</span>'
   +'<span class="cnt">'+p.c+' '+t.reviews+'</span></div>'
   +'<p class="kind">'+p.kind[L]+'</p>'
   +'<p class="meta"><span class="'+(on?"open":"")+'">'+(on?t.opennow:t.closed)+'</span>'
   +'<span class="dot">'+p.hours[L]+'</span>'
   +'<span class="dot">'+p.price+'</span>'+dst+'</p>'
   +'<div class="acts"><a class="btn" href="'+dir+'" target="_blank" rel="noopener">'+t.route+'</a>'
   +'<button class="btn sec" data-map="'+p.id+'">'+t.onmap+'</button>'
   +'<a class="btn sec" href="'+p.gmap+'" target="_blank" rel="noopener">'+t.google+'</a>'
   +call+book+'</div></article>';
 }).join("");
 drawPins();
}

/* карта: все точки на первом экране */
const LF=window.L; // Leaflet: имя L занято языком интерфейса
let map=null, MK={};
function initMap(){
 if(map||!LF)return;
 map=LF.map('map',{scrollWheelZoom:false});
 LF.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
 drawPins();
}
function pinHtml(open){const c=open?'#E0A03F':'#7C8AA3';
 return '<div style="background:'+c+';width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)"></div>';}
function drawPins(){
 if(!map)return;
 Object.values(MK).forEach(m=>map.removeLayer(m)); MK={};
 const t=UI[L], b=[];
 (openOnly?P.filter(openNow):P).forEach(p=>{
  const ic=LF.divIcon({className:'',html:pinHtml(openNow(p)),iconSize:[24,24],iconAnchor:[12,24]});
  const dir="https://www.google.com/maps/dir/?api=1&destination="+p.lat+","+p.lon+"&destination_place_id="+p.pid+(me?"&origin="+me.lat+","+me.lon:"");
  const m=LF.marker([p.lat,p.lon],{icon:ic}).addTo(map)
    .bindPopup('<div class="pn">'+p.name+'</div><div class="pr">★ '+p.r.toFixed(1)+'</div>'
      +'<div>'+p.kind[L]+'</div>'
      +'<div style="margin-top:7px"><a href="'+dir+'" target="_blank" rel="noopener">'+t.route+' →</a>'
      +' · <a href="'+p.gmap+'" target="_blank" rel="noopener">'+t.google+'</a>'
      +(p.tel?' · <a href="tel:'+p.tel+'">'+t.call+'</a>':'')+'</div>');
  MK[p.id]=m; b.push([p.lat,p.lon]);
 });
 if(me)b.push([me.lat,me.lon]);
 if(b.length)map.fitBounds(b,{padding:[34,34],maxZoom:15});
}
function focus(id){
 const m=MK[id]; if(!m)return;
 const el=document.getElementById('map'); if(el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'center'});
 map.setView(m.getLatLng(),16,{animate:true}); m.openPopup();
}

document.getElementById("themeBtn").onclick=()=>{theme=theme==="light"?"dark":"light";ls("res_theme",theme);applyTheme();};
const LANGNAMES={ru:"Русский",en:"English",pt:"Português",es:"Español",de:"Deutsch"};
const langBtn=document.getElementById('langBtn'), langMenu=document.getElementById('langMenu');
function fillLangMenu(){
 langMenu.innerHTML=LANGS.map(c=>'<button class="langopt '+(c===L?'on':'')+'" role="menuitem" data-l="'+c+'">'
  +'<span class="lc">'+c.toUpperCase()+'</span>'+LANGNAMES[c]+'</button>').join('');
}
function closeLangMenu(){langMenu.hidden=true;langBtn.setAttribute('aria-expanded','false');}
langBtn.addEventListener('click',e=>{e.stopPropagation();const open=langMenu.hidden;
 langMenu.hidden=!open;langBtn.setAttribute('aria-expanded',String(open));});
langMenu.addEventListener('click',e=>{const b=e.target.closest('.langopt');if(!b)return;
 L=b.dataset.l;ls("res_lang",L);closeLangMenu();render();});
document.addEventListener('click',e=>{if(!e.target.closest('.langwrap'))closeLangMenu();});
document.getElementById("list").addEventListener("click",e=>{
 const b=e.target.closest("[data-map]"); if(b)focus(b.getAttribute("data-map"));
});
document.getElementById("bTop").onclick=()=>{sort="top";render();};
document.getElementById("bOpen").onclick=()=>{openOnly=!openOnly;render();};
document.getElementById("bNear").onclick=()=>{
 sort="near";
 if(me){render();return;}
 if(!navigator.geolocation){render();return;}
 navigator.geolocation.getCurrentPosition(pos=>{
   me={lat:pos.coords.latitude,lon:pos.coords.longitude};
   P.forEach(p=>p._d=dist(me.lat,me.lon,p.lat,p.lon));
   render();
 },()=>{sort="top";render();},{timeout:8000,maximumAge:300000});
};

applyTheme();initMap();render();
</script></body></html>
